name: "E2E Tests (Untrusted)"

on:
  pull_request_target:

permissions:
  id-token: write
  contents: read

jobs:
  debug-refs:
    name: Debug GitHub Context
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ref_name: ${{ github.ref_name }}"
          echo "ref: ${{ github.ref }}"
          echo "base_ref: ${{ github.base_ref }}"
          echo "head_ref: ${{ github.head_ref }}"
          echo "event.pull_request.base.ref: ${{ github.event.pull_request.base.ref }}"
          echo "event_name: ${{ github.event_name }}"
  approval:
    name: Approval Gate
    environment: "approval-gate"
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id }}
    steps:
      - name: Approval Gate
        run: |
          echo "Approved!"
  e2e:
    name: "E2E Tests (${{ matrix.region }})"
    uses: ./.github/workflows/e2e-tests.yaml
    strategy:
      matrix:
        region:
          - 'us-east-1'
    needs: approval
    with:
      environment: "${{ matrix.region }}-untrusted"
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
  e2e-rosa:
    name: E2E ROSA Tests
    # Temporarily skipping rosa tests for feature/daemonset-architecture branch
    if: ${{ github.event.pull_request.base.ref != 'feature/daemonset-architecture' }}
    uses: ./.github/workflows/e2e-rosa-tests.yaml
    needs: approval
    with:
      environment: "rosa-untrusted"
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
  outcome:
    name: All E2E Tests Passed
    if: ${{ always() && github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id }}
    runs-on: ubuntu-latest
    needs:
      - e2e
      - e2e-rosa
    steps:
      - name: Verify jobs succeeded
        run: |
          if [[ "${{ github.event.pull_request.base.ref }}" == "feature/daemonset-architecture" ]]; then
            echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
          else
            echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
          fi
